<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Pomodoro Timer Widget</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }
    body { background-color: #121212; color: #ffffff; display: flex; justify-content: center; align-items: center; height: 100vh; overflow: hidden; }
    .widget-card { background: #1e1e1e; border: 1px solid #2a2a2a; border-radius: 16px; padding: 24px; width: 280px; text-align: center; box-shadow: 0 8px 24px rgba(0, 0, 0, 0.4); }
    .title { font-size: 0.9rem; text-transform: uppercase; letter-spacing: 1.5px; color: #888888; margin-bottom: 12px; }
    .mode-selector { display: flex; justify-content: center; gap: 8px; margin-bottom: 16px; }
    .mode-btn { background: #2a2a2a; border: none; color: #aaaaaa; padding: 6px 12px; border-radius: 20px; font-size: 0.75rem; cursor: pointer; transition: all 0.2s ease; }
    .mode-btn.active { background: #ff5555; color: #ffffff; font-weight: bold; }
    .timer-display { font-size: 3.5rem; font-weight: 700; letter-spacing: 2px; margin: 12px 0; color: #ffffff; }
    .controls { display: flex; justify-content: center; gap: 12px; margin-top: 16px; }
    .btn { border: none; padding: 10px 20px; border-radius: 8px; font-size: 0.9rem; font-weight: 600; cursor: pointer; transition: background 0.2s; }
    .btn-primary { background: #ff5555; color: white; }
    .btn-primary:hover { background: #ff3333; }
    .btn-secondary { background: #333333; color: #dddddd; }
    .btn-secondary:hover { background: #444444; }
  </style>
</head>
<body>
  <div class="widget-card">
    <div class="title">Pomodoro Timer</div>
    <div class="mode-selector">
      <button class="mode-btn active" id="workBtn" onclick="setMode('work')">Work</button>
      <button class="mode-btn" id="breakBtn" onclick="setMode('break')">Break</button>
    </div>
    <div class="timer-display" id="display">25:00</div>
    <div class="controls">
      <button class="btn btn-primary" id="startBtn" onclick="toggleTimer()">Start</button>
      <button class="btn btn-secondary" onclick="resetTimer()">Reset</button>
    </div>
  </div>
  <script>
    let timeLeft = 25 * 60, timerId = null, currentMode = 'work';
    const display = document.getElementById('display'), startBtn = document.getElementById('startBtn'), workBtn = document.getElementById('workBtn'), breakBtn = document.getElementById('breakBtn');
    function updateDisplay() { display.textContent = `${String(Math.floor(timeLeft / 60)).padStart(2, '0')}:${String(timeLeft % 60).padStart(2, '0')}`; }
    function toggleTimer() {
      if (timerId) { clearInterval(timerId); timerId = null; startBtn.textContent = 'Start'; }
      else { startBtn.textContent = 'Pause'; timerId = setInterval(() => { if (timeLeft > 0) { timeLeft--; updateDisplay(); } else { clearInterval(timerId); timerId = null; startBtn.textContent = 'Start'; alert(currentMode === 'work' ? 'Work session over! Take a break.' : 'Break over! Back to work.'); } }, 1000); }
    }
    function resetTimer() { if (timerId) { clearInterval(timerId); timerId = null; startBtn.textContent = 'Start'; } timeLeft = (currentMode === 'work') ? 25 * 60 : 5 * 60; updateDisplay(); }
    function setMode(mode) { currentMode = mode; workBtn.classList.toggle('active', mode === 'work'); breakBtn.classList.toggle('active', mode === 'break'); resetTimer(); }
    updateDisplay();
  </script>
</body>
</html>
