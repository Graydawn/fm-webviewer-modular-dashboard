<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Currency Converter</title>
  <style>
    :root {
      --bg: #12141a;
      --card-bg: #1b1e28;
      --accent: #6366f1;
      --accent-hover: #4f46e5;
      --text: #f3f4f6;
      --text-muted: #9ca3af;
      --border: #2e3444;
      --input-bg: #131620;
    }
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    }
    body {
      background-color: var(--bg);
      color: var(--text);
      display: flex;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      padding: 16px;
    }
    .converter-card {
      background: var(--card-bg);
      border: 1px solid var(--border);
      border-radius: 14px;
      padding: 24px;
      width: 100%;
      max-width: 380px;
      box-shadow: 0 10px 25px rgba(0, 0, 0, 0.4);
    }
    .header {
      display: flex;
      align-items: center;
      gap: 10px;
      margin-bottom: 20px;
    }
    .header h2 {
      font-size: 1.15rem;
      font-weight: 600;
    }
    .icon-badge {
      background: rgba(99, 102, 241, 0.15);
      color: var(--accent);
      width: 32px;
      height: 32px;
      display: flex;
      align-items: center;
      justify-content: center;
      border-radius: 8px;
      font-weight: bold;
    }
    .form-group {
      margin-bottom: 14px;
    }
    label {
      display: block;
      font-size: 0.8rem;
      color: var(--text-muted);
      margin-bottom: 6px;
      text-transform: uppercase;
      letter-spacing: 0.5px;
    }
    input, select {
      width: 100%;
      background: var(--input-bg);
      border: 1px solid var(--border);
      color: var(--text);
      padding: 10px 12px;
      border-radius: 8px;
      font-size: 0.95rem;
      outline: none;
      transition: border-color 0.2s;
    }
    input:focus, select:focus {
      border-color: var(--accent);
    }
    .currency-row {
      display: grid;
      grid-template-columns: 1fr auto 1fr;
      align-items: center;
      gap: 8px;
      margin-bottom: 18px;
    }
    .swap-btn {
      background: var(--border);
      border: none;
      color: var(--text);
      width: 36px;
      height: 36px;
      border-radius: 50%;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      transition: background 0.2s, transform 0.2s;
      margin-top: 18px;
    }
    .swap-btn:hover {
      background: var(--accent);
      transform: rotate(180deg);
    }
    .result-box {
      background: rgba(99, 102, 241, 0.08);
      border: 1px dashed var(--accent);
      border-radius: 8px;
      padding: 14px;
      text-align: center;
      margin-top: 10px;
    }
    .result-value {
      font-size: 1.4rem;
      font-weight: 700;
      color: #fff;
    }
    .rate-info {
      font-size: 0.75rem;
      color: var(--text-muted);
      margin-top: 6px;
    }
  </style>
</head>
<body>
  <div class="converter-card">
    <div class="header">
      <div class="icon-badge">$</div>
      <h2>Currency Converter</h2>
    </div>
    <div class="form-group">
      <label for="amount">Amount</label>
      <input type="number" id="amount" value="100" min="0" step="any" />
    </div>
    <div class="currency-row">
      <div class="form-group" style="margin-bottom:0;">
        <label for="fromCurrency">From</label>
        <select id="fromCurrency">
          <option value="USD" selected>USD ($)</option>
          <option value="EUR">EUR (€)</option>
          <option value="GBP">GBP (£)</option>
          <option value="RWF">RWF (FRw)</option>
          <option value="CAD">CAD ($)</option>
          <option value="JPY">JPY (¥)</option>
          <option value="KES">KES (KSh)</option>
          <option value="UGX">UGX (USh)</option>
        </select>
      </div>
      <button class="swap-btn" id="swapBtn" title="Swap currencies">⇄</button>
      <div class="form-group" style="margin-bottom:0;">
        <label for="toCurrency">To</label>
        <select id="toCurrency">
          <option value="USD">USD ($)</option>
          <option value="EUR">EUR (€)</option>
          <option value="GBP">GBP (£)</option>
          <option value="RWF" selected>RWF (FRw)</option>
          <option value="CAD">CAD ($)</option>
          <option value="JPY">JPY (¥)</option>
          <option value="KES">KES (KSh)</option>
          <option value="UGX">UGX (USh)</option>
        </select>
      </div>
    </div>
    <div class="result-box">
      <div class="result-value" id="resultText">--</div>
      <div class="rate-info" id="rateInfo">Fetching conversion...</div>
    </div>
  </div>
  <script>
    const exchangeRates = {
      USD: 1.0,
      EUR: 0.92,
      GBP: 0.79,
      RWF: 1410.0,
      CAD: 1.38,
      JPY: 154.5,
      KES: 130.5,
      UGX: 3720.0
    };
    const amountInput = document.getElementById('amount');
    const fromSelect = document.getElementById('fromCurrency');
    const toSelect = document.getElementById('toCurrency');
    const resultText = document.getElementById('resultText');
    const rateInfo = document.getElementById('rateInfo');
    const swapBtn = document.getElementById('swapBtn');
    function convert() {
      const amount = parseFloat(amountInput.value) || 0;
      const fromRate = exchangeRates[fromSelect.value];
      const toRate = exchangeRates[toSelect.value];
      const rate = toRate / fromRate;
      const converted = amount * rate;
      resultText.textContent = `${converted.toLocaleString(undefined, {
        minimumFractionDigits: 2,
        maximumFractionDigits: 2
      })} ${toSelect.value}`;
      rateInfo.textContent = `1 ${fromSelect.value} = ${rate.toFixed(4)} ${toSelect.value}`;
    }
    swapBtn.addEventListener('click', () => {
      const temp = fromSelect.value;
      fromSelect.value = toSelect.value;
      toSelect.value = temp;
      convert();
    });
    amountInput.addEventListener('input', convert);
    fromSelect.addEventListener('change', convert);
    toSelect.addEventListener('change', convert);
    convert();
  </script>
</body>
</html>
